name: Update CEO streak

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ceo-streak
  cancel-in-progress: true

jobs:
  update-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate today's CEO streak card
        run: node scripts/update-ceo-streak.mjs

      - name: Commit updated card
        shell: bash
        run: |
          if git diff --quiet -- assets/ceo-streak.svg; then
            echo "CEO streak card is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ceo-streak.svg
          git commit -m "chore: advance CEO streak"
          git push
