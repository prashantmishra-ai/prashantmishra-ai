<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Build signals</title>
  <desc id="desc">Innovativus has served more than 20 clients, owns more than 3 live products, supports 22 Indian languages through Pacibook, and is recognized by DPIIT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="35" x2="1140" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset=".52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#475569" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="250" rx="24"/></clipPath>
  </defs>
  <style>
    .eyebrow { font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; }
    .number { font: 800 48px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -2px; }
    .label { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sub { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .dash { animation: dash 2.8s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -38; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="250" fill="url(#bg)"/>
    <rect width="1200" height="250" fill="url(#grid)"/>
    <circle cx="72" cy="256" r="170" fill="#14B8A6" fill-opacity=".07"/>
    <circle cx="1140" cy="-8" r="170" fill="#7C3AED" fill-opacity=".09"/>

    <text x="600" y="41" text-anchor="middle" class="eyebrow" fill="#5EEAD4">COMPANY MOMENTUM • BUILT IN PUBLIC</text>
    <path d="M72 62H1128" stroke="#CBD5E1"/>
    <path d="M72 62H1128" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 12" class="dash"/>

    <g>
      <circle cx="165" cy="118" r="6" fill="#14B8A6" class="pulse"/>
      <text x="165" y="151" text-anchor="middle" class="number" fill="#0F172A">20+</text>
      <text x="165" y="180" text-anchor="middle" class="label" fill="#1E293B">CLIENTS</text>
      <text x="165" y="204" text-anchor="middle" class="sub" fill="#475569">SERVED GLOBALLY</text>
    </g>

    <path d="M310 91V211" stroke="#CBD5E1"/>
    <g>
      <circle cx="456" cy="118" r="6" fill="#22D3EE" class="pulse" style="animation-delay:-.7s"/>
      <text x="456" y="151" text-anchor="middle" class="number" fill="#0F172A">3+</text>
      <text x="456" y="180" text-anchor="middle" class="label" fill="#1E293B">LIVE PRODUCTS</text>
      <text x="456" y="204" text-anchor="middle" class="sub" fill="#475569">OWNED &amp; OPERATED</text>
    </g>

    <path d="M600 91V211" stroke="#CBD5E1"/>
    <g>
      <circle cx="744" cy="118" r="6" fill="#A78BFA" class="pulse" style="animation-delay:-1.4s"/>
      <text x="744" y="151" text-anchor="middle" class="number" fill="#0F172A">22</text>
      <text x="744" y="180" text-anchor="middle" class="label" fill="#1E293B">INDIAN LANGUAGES</text>
      <text x="744" y="204" text-anchor="middle" class="sub" fill="#475569">POWERING PACIBOOK</text>
    </g>

    <path d="M888 91V211" stroke="#CBD5E1"/>
    <g>
      <circle cx="1034" cy="118" r="6" fill="#F59E0B" class="pulse" style="animation-delay:-2.1s"/>
      <text x="1034" y="151" text-anchor="middle" class="number" fill="#0F172A">DPIIT</text>
      <text x="1034" y="180" text-anchor="middle" class="label" fill="#1E293B">RECOGNIZED</text>
      <text x="1034" y="204" text-anchor="middle" class="sub" fill="#475569">STARTUP INDIA</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="248.5" rx="23.25" stroke="url(#accent)" stroke-opacity=".36" stroke-width="1.5"/>
</svg>
