<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Prashant Mishra — Founder, CEO, and Managing Director</title>
  <desc id="desc">Animated executive profile banner for the founder of Innovativus Technologies and Pacibook.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="18" x2="1160" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="82" x2="1010" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1040 36) rotate(133) scale(345 255)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(138 400) rotate(-52) scale(330 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#475569" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>
  <style>
    .eyebrow { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 4px; }
    .name { font: 800 62px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -2.8px; }
    .role { font: 600 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .meta { font: 500 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chip { font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .6px; }
    .orbit { animation: orbit 16s linear infinite; transform-origin: 952px 210px; }
    .orbit-reverse { animation: orbit-reverse 22s linear infinite; transform-origin: 952px 210px; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
    .cursor { animation: blink 1.05s step-end infinite; }
    .scan { animation: scan 7s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes scan { 0%, 100% { transform: translateX(-240px); opacity: 0; } 18%, 72% { opacity: .55; } 88% { transform: translateX(1120px); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glowA)"/>
    <rect width="1200" height="420" fill="url(#glowB)"/>
    <path class="scan" d="M0 0H90L265 420H175L0 0Z" fill="url(#accent)" opacity=".18" filter="url(#blur)"/>

    <g opacity=".7">
      <circle cx="96" cy="72" r="3" fill="#14B8A6" class="pulse"/>
      <path d="M108 72H236" stroke="#14B8A6" stroke-opacity=".44"/>
      <path d="M1084 350H1150" stroke="#8B5CF6" stroke-opacity=".5"/>
      <circle cx="1072" cy="350" r="3" fill="#8B5CF6" class="pulse"/>
    </g>

    <text x="82" y="86" class="eyebrow" fill="#5EEAD4">FOUNDER MODE • ON</text>
    <text x="78" y="169" class="name" fill="#0F172A">PRASHANT MISHRA</text>
    <rect x="80" y="191" width="522" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="80" y="238" class="role" fill="#1E293B">CEO &amp; Managing Director</text>
    <text x="80" y="272" class="role" fill="#475569">Innovativus Technologies <tspan fill="#22D3EE">|</tspan> Pacibook</text>
    <text x="80" y="319" class="meta" fill="#334155">Building AI products, publishing systems, and companies</text>
    <text x="80" y="347" class="meta" fill="#334155">from New Delhi to the world<tspan class="cursor" fill="#5EEAD4">_</tspan></text>

    <g filter="url(#shadow)">
      <rect x="80" y="371" width="136" height="31" rx="15.5" fill="#ECFEFF" stroke="#14B8A6" stroke-opacity=".45"/>
      <text x="148" y="391.5" class="chip" text-anchor="middle" fill="#5EEAD4">AI PRODUCTS</text>
      <rect x="227" y="371" width="160" height="31" rx="15.5" fill="#F5F3FF" stroke="#8B5CF6" stroke-opacity=".5"/>
      <text x="307" y="391.5" class="chip" text-anchor="middle" fill="#C4B5FD">DIGITAL BOOKS</text>
      <rect x="398" y="371" width="139" height="31" rx="15.5" fill="#FFFBEB" stroke="#F59E0B" stroke-opacity=".45"/>
      <text x="467.5" y="391.5" class="chip" text-anchor="middle" fill="#FCD34D">COMPANIES</text>
    </g>

    <g>
      <circle cx="952" cy="210" r="122" stroke="#CBD5E1" stroke-opacity=".72"/>
      <circle cx="952" cy="210" r="158" stroke="#CBD5E1" stroke-opacity=".43" stroke-dasharray="5 12" class="orbit-reverse"/>
      <circle cx="952" cy="210" r="94" stroke="url(#accent)" stroke-opacity=".85" stroke-dasharray="16 10" class="orbit"/>
      <circle cx="952" cy="210" r="67" fill="#FFFFFF" stroke="url(#accent)" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="952" cy="210" r="51" fill="none" stroke="#22D3EE" stroke-opacity=".24" class="pulse"/>
      <text x="952" y="202" text-anchor="middle" class="eyebrow" fill="#5EEAD4">BUILD</text>
      <text x="952" y="230" text-anchor="middle" class="meta" fill="#0F172A">SHIP • LEARN</text>

      <g class="orbit">
        <circle cx="952" cy="116" r="10" fill="#14B8A6"/>
        <circle cx="952" cy="116" r="18" fill="none" stroke="#14B8A6" stroke-opacity=".3" class="pulse"/>
      </g>
      <g class="orbit-reverse">
        <circle cx="1110" cy="210" r="8" fill="#8B5CF6"/>
        <circle cx="794" cy="210" r="6" fill="#F59E0B"/>
      </g>
    </g>

    <g class="float" filter="url(#shadow)">
      <rect x="1026" y="76" width="120" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="1048" cy="97" r="5" fill="#22D3EE"/>
      <text x="1062" y="102" class="chip" fill="#1E293B">VISION</text>
    </g>
    <g class="float" style="animation-delay:-2.2s" filter="url(#shadow)">
      <rect x="773" y="302" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="795" cy="323" r="5" fill="#A78BFA"/>
      <text x="809" y="328" class="chip" fill="#1E293B">EXECUTION</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="27.25" stroke="url(#accent)" stroke-opacity=".36" stroke-width="1.5"/>
</svg>
